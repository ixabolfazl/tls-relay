<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TLS Relay Admin</title>
  <link rel="stylesheet" href="css/app.css" />
  <script src="js/theme-init.js"></script>
</head>
<body class="min-h-full bg-bg text-txt flex flex-col font-sans selection:bg-primary-500 selection:text-white">
  <!-- Splash Screen (Initial Auth Probe) -->
  <div id="splash-screen" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-bg gap-3">
    <div class="w-10 h-10 rounded-xl bg-primary flex items-center justify-center text-white shadow-md animate-pulse">
      <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
      </svg>
    </div>
    <span class="text-xs font-semibold text-txt-muted tracking-wider uppercase">Loading TLS Relay...</span>
  </div>

  <!-- Login Root -->
  <div id="login-root" class="hidden min-h-screen"></div>

  <!-- Main App Shell -->
  <div id="app-shell" class="hidden min-h-screen flex flex-col">
    <!-- Topbar -->
    <header class="sticky top-0 z-40 bg-surface/90 backdrop-blur border-b border-border">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16 gap-4">
          <!-- Logo & Brand -->
          <div class="flex items-center gap-3 shrink-0">
            <div class="w-9 h-9 rounded-xl bg-primary flex items-center justify-center text-white shadow-sm">
              <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
              </svg>
            </div>
            <div>
              <div class="text-base font-bold text-txt leading-none">TLS Relay</div>
              <div class="text-[10px] text-txt-muted uppercase font-semibold tracking-wider mt-0.5">Admin Console</div>
            </div>
          </div>

          <!-- Top Navigation Tabs (Desktop & Tablet) -->
          <nav class="hidden md:flex items-center gap-1 overflow-x-auto" aria-label="Main Navigation">
            <a href="#dashboard" class="nav-tab-link flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-medium text-txt-muted hover:text-txt hover:bg-surface-2 transition-colors shrink-0" data-route="dashboard">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
              <span>Dashboard</span>
            </a>
            <a href="#domains" class="nav-tab-link flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-medium text-txt-muted hover:text-txt hover:bg-surface-2 transition-colors shrink-0" data-route="domains">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"/></svg>
              <span>Domains</span>
            </a>
            <a href="#users" class="nav-tab-link flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-medium text-txt-muted hover:text-txt hover:bg-surface-2 transition-colors shrink-0" data-route="users">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
              <span>Users</span>
            </a>
            <a href="#blacklist" class="nav-tab-link flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-medium text-txt-muted hover:text-txt hover:bg-surface-2 transition-colors shrink-0" data-route="blacklist">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636"/></svg>
              <span>Blacklist</span>
            </a>
            <a href="#request-logs" class="nav-tab-link flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-medium text-txt-muted hover:text-txt hover:bg-surface-2 transition-colors shrink-0" data-route="request-logs">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
              <span>Logs</span>
            </a>
            <a href="#usage" class="nav-tab-link flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-medium text-txt-muted hover:text-txt hover:bg-surface-2 transition-colors shrink-0" data-route="usage">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
              <span>Usage</span>
            </a>
            <a href="#settings" class="nav-tab-link flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-medium text-txt-muted hover:text-txt hover:bg-surface-2 transition-colors shrink-0" data-route="settings">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/></svg>
              <span>Settings</span>
            </a>
          </nav>

          <!-- Topbar Actions -->
          <div class="flex items-center gap-2.5 shrink-0">
            <!-- Theme Toggle -->
            <button id="theme-toggle-btn" type="button" class="btn-icon" aria-label="Toggle light/dark theme" title="Toggle theme">
              <svg class="w-5 h-5 hidden dark:block" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
              </svg>
              <svg class="w-5 h-5 block dark:hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
              </svg>
            </button>

            <!-- Admin User Badge -->
            <div class="hidden sm:flex items-center gap-2 pl-2 border-l border-border">
              <span id="topbar-admin-username" class="text-xs font-semibold text-txt">admin</span>
            </div>

            <!-- Sign out -->
            <button id="logout-btn" type="button" class="btn-icon text-txt-subtle hover:text-danger" aria-label="Sign out" title="Sign out">
              <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Mobile Scrollable Navigation -->
        <nav class="flex md:hidden items-center gap-1 overflow-x-auto py-2.5 -mx-4 px-4 border-t border-border/60 text-xs" aria-label="Mobile Navigation">
          <a href="#dashboard" class="nav-tab-link px-3 py-1.5 rounded-lg text-txt-muted hover:text-txt shrink-0" data-route="dashboard">Dashboard</a>
          <a href="#domains" class="nav-tab-link px-3 py-1.5 rounded-lg text-txt-muted hover:text-txt shrink-0" data-route="domains">Domains</a>
          <a href="#users" class="nav-tab-link px-3 py-1.5 rounded-lg text-txt-muted hover:text-txt shrink-0" data-route="users">Users</a>
          <a href="#blacklist" class="nav-tab-link px-3 py-1.5 rounded-lg text-txt-muted hover:text-txt shrink-0" data-route="blacklist">Blacklist</a>
          <a href="#request-logs" class="nav-tab-link px-3 py-1.5 rounded-lg text-txt-muted hover:text-txt shrink-0" data-route="request-logs">Logs</a>
          <a href="#usage" class="nav-tab-link px-3 py-1.5 rounded-lg text-txt-muted hover:text-txt shrink-0" data-route="usage">Usage</a>
          <a href="#settings" class="nav-tab-link px-3 py-1.5 rounded-lg text-txt-muted hover:text-txt shrink-0" data-route="settings">Settings</a>
        </nav>
      </div>
    </header>

    <!-- Main View Content -->
    <main id="view" class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6"></main>

    <!-- Footer -->
    <footer class="border-t border-border py-4 text-center text-xs text-txt-subtle mt-auto">
      <span>TLS-SNI Relay & DNS Resolver</span>
    </footer>
  </div>

  <!-- Toast Container -->
  <div id="toast-root" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none max-w-sm w-full" aria-live="polite"></div>

  <!-- Main JavaScript Module -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
