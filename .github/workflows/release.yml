name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name for manual release (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            goarch: amd64
          - os: linux
            arch: arm64
            goarch: arm64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          check-latest: true
          cache: true

      - name: Set Release Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Build Binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          LDFLAGS="-s -w -trimpath \
            -X 'main.version=${{ steps.vars.outputs.TAG }}' \
            -X 'main.commit=${{ github.sha }}' \
            -X 'main.buildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)'"
          go build -ldflags "$LDFLAGS" -o tls-relay ./cmd/relay

      - name: Package Release Asset
        run: |
          PACKAGE_NAME="tls-relay-${{ matrix.os }}-${{ matrix.arch }}.tar.gz"
          chmod +x tls-relay tls-relay.sh

          tar -czvf "${PACKAGE_NAME}" \
            tls-relay \
            tls-relay.sh \
            tls-relay.service \
            config.yaml \
            .env.example

          sha256sum "${PACKAGE_NAME}" > "${PACKAGE_NAME}.sha256"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            tls-relay-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
            tls-relay-${{ matrix.os }}-${{ matrix.arch }}.tar.gz.sha256

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Determine Tag
        id: tag_step
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_step.outputs.TAG }}
          name: Release ${{ steps.tag_step.outputs.TAG }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/*.tar.gz
            release-assets/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
