name: CI

on:
  push:
    branches:
      - main
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/ci.yml"
      - "internal/panel/static/**"
      - "tailwind.config.js"
      - "Makefile"
  pull_request:
    branches:
      - main
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/ci.yml"
      - "internal/panel/static/**"
      - "tailwind.config.js"
      - "Makefile"

permissions:
  contents: read

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cache Tailwind CLI
        id: cache-tailwind
        uses: actions/cache@v4
        with:
          path: .bin/tailwindcss
          key: tailwind-cli-v3.4.17-linux-x64

      - name: Setup Tailwind CLI
        if: steps.cache-tailwind.outputs.cache-hit != 'true'
        run: |
          mkdir -p .bin
          curl -sL -o .bin/tailwindcss https://github.com/tailwindlabs/tailwindcss/releases/download/v3.4.17/tailwindcss-linux-x64
          chmod +x .bin/tailwindcss

      - name: Ensure CLI Executable & Build CSS
        run: |
          chmod +x .bin/tailwindcss || true
          make css

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Format Check
        run: |
          diffs=$(gofmt -l .)
          if [ -n "$diffs" ]; then
            echo "The following files are not formatted:"
            echo "$diffs"
            exit 1
          fi

      - name: Go Vet
        run: go vet ./...

      - name: Run Tests with Race Detector
        run: go test -v -race -shuffle=on ./...

      - name: Shell Scripts Syntax Check
        run: |
          bash -n tls-relay.sh install.sh
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck tls-relay.sh install.sh || true
          fi

  security:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          check-latest: true
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        continue-on-error: true
        run: govulncheck ./...
